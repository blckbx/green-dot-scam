name: Daily Green Dot
on:
  schedule:
    - cron: '0 0 * * *'  # Midnight UTC daily
  push:  # For code pushes
  pull_request:  # For PRs
  workflow_dispatch:  # Manual testing

jobs:
  daily-update:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'  # Only cron/manual
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Configure Git identity
      run: |
        git config --local user.email "74455114+blckbx@users.noreply.github.com"
        git config --local user.name "blckbx"

    - name: Update date
      run: |
        echo "$(date)" > last-update.txt
        git add last-update.txt || true
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "Daily update $(date)"
          git push
        fi

  ci-check:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Echo hello world
      run: echo "Hello World"

  backfill-green-dots:
    if: github.event_name == 'workflow_dispatch'  # Only manual trigger
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Configure Git identity
      run: |
        git config --local user.email "74455114+blckbx@users.noreply.github.com"
        git config --local user.name "blckbx"

    - name: Backfill 365 days of green dots
      run: |
        touch streak.txt

        # Loop back 365 days, commit once per day with historical date
        for i in {0..364}; do
          # Calculate date: today minus i days (UTC for GitHub consistency)
          DATE=$(date -d "${i} days ago" '+%Y-%m-%dT%H:%M:%SZ')

          # Amend/add a tiny change (e.g., append day number)
          echo "Day -$i: $(date -d "${i} days ago" '+%Y-%m-%d')" >> streak.txt
          git add streak.txt

          # Commit with both author and committer date set to historical
          GIT_AUTHOR_DATE="$DATE" GIT_COMMITTER_DATE="$DATE" \
            git commit --allow-empty -m "Backfill streak: $DATE" --date="$DATE"
        done

        # Force-push the rewritten history (warning: rewrites all commits!)
        git push --force-with-lease origin HEAD:main  # Assumes main branch; swap if needed      
