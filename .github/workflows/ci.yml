name: Daily Green Dot
on:
  schedule:
    - cron: '0 0 * * *'  # Midnight UTC daily
  push:  # For code pushes
  pull_request:  # For PRs
  workflow_dispatch:  # Manual testing

jobs:
  daily-update:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'  # Only cron/manual
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Configure Git identity
      run: |
        git config --local user.email "74455114+blckbx@users.noreply.github.com"
        git config --local user.name "blckbx"

    - name: Update date
      run: |
        echo "$(date)" > last-update.txt
        git add last-update.txt || true
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "Daily update $(date)"
          git push
        fi

  ci-check:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Echo hello world
      run: echo "Hello World"

  backfill-green-dots:
    if: github.event_name == 'workflow_dispatch'  # Only manual trigger
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Configure Git identity
      run: |
        git config --local user.email "74455114+blckbx@users.noreply.github.com"
        git config --local user.name "blckbx"

    - name: Backfill 365 days of green dots
      run: |
        touch streak.txt

    - name: Backfill 365 days with variable commits (1-20 per day, 9-5 only)
      run: |
        # Create file for changes
        touch streak.txt

        # Outer loop: 365 days back
        for i in {0..364}; do
          # Historical day (UTC)
          HIST_DATE=$(date -d "${i} days ago" '+%Y-%m-%d')

          # Random commits for this day: 1-20
          COMMITS_PER_DAY=$((1 + RANDOM % 20))
          echo "Backfilling day -$i with $COMMITS_PER_DAY commits (9-5 UTC)"

          # Inner loop: Spread across working hours (9:00-17:00)
          for j in $(seq 1 $COMMITS_PER_DAY); do
            # Space evenly in 9-17 (8-hour window)
            TOTAL_SLOTS=8
            HOUR_OFFSET=$(( (j * TOTAL_SLOTS / COMMITS_PER_DAY) - 1 ))
            HOUR=$((9 + HOUR_OFFSET))
            MINS=$(( RANDOM % 60 ))
            SECS=$(( RANDOM % 60 ))

            # Build clean datetime string for date command
            TIME_STR="${HOUR}:${MINS}:${SECS}"
            FULL_DATE="${HIST_DATE} ${TIME_STR}"

            # Parse to ISO format
            DATE=$(date --date "${FULL_DATE} UTC" '+%Y-%m-%dT%H:%M:%SZ')

            # Tiny unique change
            echo "Work commit $j/$COMMITS_PER_DAY on ${FULL_DATE} UTC" >> streak.txt
            git add streak.txt

            # Commit with historical date
            GIT_AUTHOR_DATE="$DATE" GIT_COMMITTER_DATE="$DATE" \
              git commit --allow-empty -m "Backfill: Work activity on $DATE" --date="$DATE"
          done
        done

        # Sync and force-push
        git pull --rebase origin main
        git push --force-with-lease origin HEAD:main
