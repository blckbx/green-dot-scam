name: Daily Green Dot
on:
  schedule:
    - cron: '0 0 * * *'  # Midnight UTC daily
  workflow_dispatch:  # Optional: manual trigger
jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.USERINFO }}  # Authenticates as you
        fetch-depth: 0  # For full history if needed

    - name: Update date
      run: |
        echo "$(date)" > last-update.txt
        git add last-update.txt
        git commit -m "Daily update $(date)"
        git push  # Token handles auth automatically
